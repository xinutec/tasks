<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Deliberately NOT memview's deep purple: the two sit side by side on the
       same launcher, and an icon that only differs by its mark is one you tap
       wrong at a glance. -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="#1565c0"/>
  <!-- A task, and it moving: a ticked box with an arrow leaving it. That is the
       whole thesis of the app — the list is not the point, the handover is. -->
  <rect x="12" y="16" width="26" height="26" rx="5" fill="none" stroke="#fff" stroke-width="4"/>
  <path d="M18 29 L24 35 L34 22" fill="none" stroke="#fff" stroke-width="4"
        stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M20 52 H44" fill="none" stroke="#bbdefb" stroke-width="4" stroke-linecap="round"/>
  <path d="M38 46 L45 52 L38 58" fill="none" stroke="#bbdefb" stroke-width="4"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
