<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>tasks</title>
    <base href="/" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, interactive-widget=resizes-content"
    />
    <!-- Matches the icon and the Android launcher background: the shell
         paints the system bars from the page, so this is what the phone's
         status bar becomes. -->
    <meta name="theme-color" content="#1565c0" />
    <link rel="icon" type="image/svg+xml" href="icon.svg" />
    <!-- dev-lint: self-contained-ui — served over the VPN; it must render
         without any third-party fetch. Roboto + Material Icons are bundled
         from npm (angular.json styles list), not fetched from Google. -->
    <script>
      // A deploy removed the bundle this page names: see @xinutec/ui-harness,
      // MISSING_BUNDLE_RECOVERY. Drop the service worker and its caches, and reload.
      addEventListener(
        'error',
        function (e) {
          var s = e.target;
          if (!(s instanceof HTMLScriptElement) || !/\/main-[^/]*\.js$/.test(s.src)) return;
          try {
            var last = Number(sessionStorage.getItem('missing-bundle-reload')) || 0;
            if (Date.now() - last < 60000) return;
            sessionStorage.setItem('missing-bundle-reload', String(Date.now()));
          } catch (_) {
            return;
          }
          var sw = navigator.serviceWorker;
          Promise.all([
            sw &&
              sw.getRegistrations().then(function (all) {
                return Promise.all(
                  all.map(function (r) {
                    return r.unregister();
                  }),
                );
              }),
            window.caches &&
              caches.keys().then(function (keys) {
                return Promise.all(
                  keys
                    .filter(function (k) {
                      return k.indexOf('ngsw:') === 0;
                    })
                    .map(function (k) {
                      return caches.delete(k);
                    }),
                );
              }),
          ]).finally(function () {
            location.reload();
          });
        },
        true,
      );
    </script>
  </head>
  <body class="mat-typography">
    <app-root></app-root>
  </body>
</html>
